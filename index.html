<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quả Cầu 3D Tương Tác Bàn Tay</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    video {
      transform: scaleX(-1);
      position: absolute;
      top: 10px;
      left: 10px;
      width: 160px;
      height: 120px;
      border-radius: 8px;
      border: 2px solid #00ffcc;
      z-index: 10;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffcc;
      font-size: 18px;
      z-index: 20;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">Đang tải Camera & Mô hình AI...</div>
  <video id="input-video" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    const videoElement = document.getElementById('input-video');
    const loadingElement = document.getElementById('loading');
    
    // 1. KHỞI TẠO THREE.JS
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. TẠO TẬP HỢP HẠT HÌNH CẦU
    const particleCount = 2000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const originalPositions = new Float32Array(particleCount * 3);
    const dirs = new Float32Array(particleCount * 3);

    const radius = 1.5;
    for (let i = 0; i < particleCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);

      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      originalPositions[i * 3] = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      // Hướng văng hạt khi nổ
      const len = Math.sqrt(x * x + y * y + z * z);
      dirs[i * 3] = (x / len) * (0.8 + Math.random() * 1.2);
      dirs[i * 3 + 1] = (y / len) * (0.8 + Math.random() * 1.2);
      dirs[i * 3 + 2] = (z / len) * (0.8 + Math.random() * 1.2);
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00ffff,
      size: 0.04,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const sphereParticles = new THREE.Points(geometry, material);
    scene.add(sphereParticles);

    // 3. BIẾN ĐIỀU KHIỂN
    let targetX = 0, targetY = 0;
    let handPinchScale = 1.0;
    let isFist = false;
    let explodeProgress = 0;

    // 4. XỬ LÝ NHẬN DIỆN MEDIAPIPE HANDS
    function onResults(results) {
      loadingElement.style.display = 'none';
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        
        // A. Di chuyển theo vị trí lòng bàn tay (landmark 9)
        targetX = (0.5 - lm[9].x) * 7;
        targetY = (0.5 - lm[9].y) * 5;

        // B. Phóng to / Thu nhỏ (Khoảng cách giữa ngón cái 4 và ngón trỏ 8)
        const dx = lm[4].x - lm[8].x;
        const dy = lm[4].y - lm[8].y;
        const distPinch = Math.sqrt(dx * dx + dy * dy);
        handPinchScale = Math.max(0.4, Math.min(distPinch * 5, 2.5));

        // C. Kiểm tra Nắm đấm (Tính khoảng cách các đầu ngón tay đến cổ tay landmark 0)
        let totalDist = 0;
        const tips = [8, 12, 16, 20];
        for (let i = 0; i < tips.length; i++) {
          const tx = lm[tips[i]].x - lm[0].x;
          const ty = lm[tips[i]].y - lm[0].y;
          totalDist += Math.sqrt(tx * tx + ty * ty);
        }
        
        // Nếu tổng khoảng cách nhỏ -> Tay đang nắm lại
        isFist = (totalDist / tips.length) < 0.28;

      } else {
        handPinchScale = 1.0;
        isFist = false;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    // 5. VÒNG LẶP HÌNH ẢNH (ANIMATION LOOP)
    function animate() {
      requestAnimationFrame(animate);

      // Cập nhật vị trí quả cầu
      sphereParticles.position.x += (targetX - sphereParticles.position.x) * 0.1;
      sphereParticles.position.y += (targetY - sphereParticles.position.y) * 0.1;

      sphereParticles.rotation.y += 0.005;

      // Xử lý nổ / thu gom hạt
      if (isFist) {
        if (explodeProgress < 1.0) explodeProgress += 0.06;
      } else {
        if (explodeProgress > 0.0) explodeProgress -= 0.05;
      }

      const pos = geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const bx = originalPositions[i * 3] * handPinchScale;
        const by = originalPositions[i * 3 + 1] * handPinchScale;
        const bz = originalPositions[i * 3 + 2] * handPinchScale;

        const ex = dirs[i * 3] * explodeProgress * 4;
        const ey = dirs[i * 3 + 1] * explodeProgress * 4;
        const ez = dirs[i * 3 + 2] * explodeProgress * 4;

        pos[i * 3] = bx + ex;
        pos[i * 3 + 1] = by + ey;
        pos[i * 3 + 2] = bz + ez;
      }
      geometry.attributes.position.needsUpdate = true;

      // Đổi màu chói đỏ khi nổ
      if (explodeProgress > 0.2) {
        material.color.setHex(0xff2200);
      } else {
        material.color.setHex(0x00ffff);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
