<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quả Cầu 3D - Di Chuyển & Nổ Tung</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    video {
      transform: scaleX(-1);
      position: absolute;
      top: 10px;
      left: 10px;
      width: 160px;
      height: 120px;
      border-radius: 8px;
      border: 2px solid #00ffcc;
      z-index: 10;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffcc;
      font-size: 20px;
      z-index: 20;
    }
  </style>

  <!-- Thư viện Three.js và MediaPipe -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">Đang tải Camera & Mô hình nhận diện...</div>
  <video id="input-video" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    const videoElement = document.getElementById('input-video');
    const loadingElement = document.getElementById('loading');
    
    // --- SCENE & CAMERA ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- TẠO HẠT QUẢ CẦU 3D ---
    const particleCount = 2500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const originalPositions = new Float32Array(particleCount * 3);
    const velocities = new Float32Array(particleCount * 3);

    const radius = 1.5;
    for (let i = 0; i < particleCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);

      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      originalPositions[i * 3] = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      // Hướng nổ văng hạt ra ngoài
      velocities[i * 3] = (Math.random() - 0.5) * 0.15;
      velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.15;
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00ffff,
      size: 0.045,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const sphereParticles = new THREE.Points(geometry, material);
    scene.add(sphereParticles);

    // --- TRẠNG THÁI ĐIỀU KHIỂN ---
    let targetX = 0, targetY = 0;
    let handPinchScale = 1.0;
    let isExploded = false;
    let explosionFactor = 0; // Tỉ lệ nổ (0 -> 1)

    // --- XỬ LÝ HAND TRACKING ---
    function onResults(results) {
      loadingElement.style.display = 'none';
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // 1. DI CHUYỂN QUẢ CẦU THEO LÒNG BÀN TAY (Landmark 9)
        const palm = landmarks[9];
        targetX = (0.5 - palm.x) * 8; // Đảo ngược x để trùng hướng camera
        targetY = (0.5 - palm.y) * 6;

        // 2. PHÓNG TO / THU NHỎ (Khoảng cách Ngón trỏ 8 & Ngón cái 4)
        const thumb = landmarks[4];
        const index = landmarks[8];
        const distPinch = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        handPinchScale = Math.max(0.4, Math.min(distPinch * 4.5, 2.2));

        // 3. NHẬN DIỆN NẮM TAY ĐỂ NỔ TUNG (Đo khoảng cách các đầu ngón tay về cổ tay landmark 0)
        const isFist = [8, 12, 16, 20].every(tipIdx => {
          const tip = landmarks[tipIdx];
          const wrist = landmarks[0];
          return Math.hypot(tip.x - wrist.x, tip.y - wrist.y) < 0.25;
        });

        if (isFist) {
          isExploded = true;
        } else {
          isExploded = false;
        }

      } else {
        handPinchScale = 1.0;
        isExploded = false;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraUtils.start();

    // --- LOOP KHỦNG LONG VÒNG LẶP ANIMATION ---
    function animate() {
      requestAnimationFrame(animate);

      // Quả cầu di chuyển mượt mà theo tay (Smooth Interpolation)
      sphereParticles.position.x += (targetX - sphereParticles.position.x) * 0.1;
      sphereParticles.position.y += (targetY - sphereParticles.position.y) * 0.1;

      // Xoay quả cầu nhẹ
      sphereParticles.rotation.y += 0.008;
      sphereParticles.rotation.x += 0.003;

      // Xử lý nổ tung hạt
      if (isExploded) {
        if (explosionFactor < 1.0) explosionFactor += 0.08;
      } else {
        if (explosionFactor > 0.0) explosionFactor -= 0.05;
      }

      const posAttr = geometry.attributes.position;
      for (let i = 0; i < particleCount; i++) {
        // Vị trí chuẩn khi phóng to/thu nhỏ
        const baseFx = originalPositions[i * 3] * handPinchScale;
        const baseFy = originalPositions[i * 3 + 1] * handPinchScale;
        const baseFz = originalPositions[i * 3 + 2] * handPinchScale;

        // Tốc độ bay văng hạt khi nổ
        const expX = velocities[i * 3] * explosionFactor * 35;
        const expY = velocities[i * 3 + 1] * explosionFactor * 35;
        const expZ = velocities[i * 3 + 2] * explosionFactor * 35;

        posAttr.array[i * 3] = baseFx + expX;
        posAttr.array[i * 3 + 1] = baseFy + expY;
        posAttr.array[i * 3 + 2] = baseFz + expZ;
      }
      posAttr.needsUpdate = true;

      // Thay đổi màu khi nổ sang đỏ/cam chói
      if (isExploded) {
        material.color.setHex(0xff3300);
      } else {
        material.color.setHex(0x00ffff);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
