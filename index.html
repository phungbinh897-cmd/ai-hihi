<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Iron Man Mark-85 Armor System</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020813;
      font-family: 'Courier New', Courier, monospace;
      color: #00f0ff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    video {
      transform: scaleX(-1);
      position: absolute;
      top: 15px;
      right: 15px; /* Chuyen Camera sang goc phai de nhuong goc trai cho giap */
      width: 130px;
      height: 95px;
      border-radius: 8px;
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      z-index: 10;
    }
    .hud-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      text-align: left;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px #00f0ff;
    }
    .hud-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .hud-status {
      font-size: 12px;
      color: #00ffcc;
      margin-top: 5px;
    }

    /* BẢNG ĐIỀU KHIỂN JARVIS PANEL */
    #control-panel {
      position: absolute;
      bottom: 30px;
      right: -350px; /* An sang ben phai màn hinh */
      width: 280px;
      padding: 18px;
      background: rgba(2, 12, 27, 0.88);
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      z-index: 30;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(6px);
    }
    #control-panel.active {
      right: 20px;
    }
    .panel-header {
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #00f0ff;
      padding-bottom: 5px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    .panel-item {
      font-size: 11px;
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      font-size: 16px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00f0ff;
      z-index: 20;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">CONSTRUCTING MARK-85 HOLO-ARMOR...</div>
  
  <div class="hud-overlay">
    <div class="hud-title">MARK-85 ARMOR DISPLAY</div>
    <div id="hud-mode" class="hud-status">WAITING FOR HAND TRACKING</div>
  </div>

  <div id="control-panel">
    <div class="panel-header">JARVIS CONTROL INTERFACE</div>
    <div class="panel-item"><span>ARMOR MODEL:</span><span style="color:#00ffcc;">MARK 85</span></div>
    <div class="panel-item"><span>ARC REACTOR:</span><span style="color:#00ffcc;">STABLE (100%)</span></div>
    <div class="panel-item"><span>NANO MATRIX:</span><span style="color:#00ffcc;">ACTIVE</span></div>
    <div class="panel-item"><span>STATUS:</span><span style="color:#00f0ff;">CONNECTED</span></div>
  </div>

  <video id="input-video" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    const videoElement = document.getElementById('input-video');
    const loadingElement = document.getElementById('loading');
    const hudMode = document.getElementById('hud-mode');
    const controlPanel = document.getElementById('control-panel');
    
    // 1. THREE.JS SETUP
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6.0;

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. DỰNG TẠO HÌNH BỘ GIÁP IRON MAN BẰNG HẠT 3D (POINT-CLOUD ARMOR)
    const particleCount = 3000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const originalPositions = new Float32Array(particleCount * 3);
    const dirs = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      let x = 0, y = 0, z = 0;
      const part = Math.random();

      if (part < 0.20) { 
        // A. MŨ BẢO HIỂM IRON MAN (HELMET)
        const u = Math.random() * Math.PI * 2;
        const v = Math.random() * Math.PI;
        x = 0.5 * Math.sin(v) * Math.cos(u);
        y = 1.6 + 0.55 * Math.cos(v);
        z = 0.5 * Math.sin(v) * Math.sin(u) * 0.85; // Mặt thon hơn
      } else if (part < 0.60) { 
        // B. THÂN & NGỰC GIÁP (CHEST & ARC REACTOR)
        const u = Math.random() * Math.PI * 2;
        const h = (Math.random() - 0.5) * 1.8;
        const rad = (1.1 - Math.abs(h) * 0.35) * (1 + 0.1 * Math.cos(u * 3));
        x = rad * Math.cos(u);
        y = h + 0.2;
        z = rad * Math.sin(u) * 0.7;
      } else if (part < 0.85) { 
        // C. VAI VÀ BẮP TAY (SHOULDERS & ARMS)
        const side = Math.random() > 0.5 ? 1 : -1;
        const armH = (Math.random() - 0.5) * 1.6;
        x = side * (1.2 + Math.random() * 0.45);
        y = armH + 0.3;
        z = (Math.random() - 0.5) * 0.6;
      } else { 
        // D. LÕI ARC REACTOR RỰC SÁNG Ở NGỰC (CENTRAL CORE)
        const rad = Math.random() * 0.35;
        const ang = Math.random() * Math.PI * 2;
        x = rad * Math.cos(ang);
        y = 0.5 + rad * Math.sin(ang);
        z = 0.45; // Nổi nhẹ ra phía trước ngực
      }

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      originalPositions[i * 3] = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      const len = Math.sqrt(x * x + y * y + z * z) || 1;
      dirs[i * 3] = (x / len) * (1.2 + Math.random() * 1.5);
      dirs[i * 3 + 1] = (y / len) * (1.2 + Math.random() * 1.5);
      dirs[i * 3 + 2] = (z / len) * (1.2 + Math.random() * 1.5);
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00f0ff,
      size: 0.042,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });

    const ironmanArmor = new THREE.Points(geometry, material);
    
    // ĐẶT BỘ GIÁP Ở CỐ ĐỊNH GÓC TRÁI MÀN HÌNH
    const baseOffsetX = -2.8; 
    ironmanArmor.position.x = baseOffsetX;
    ironmanArmor.position.y = -0.2;
    scene.add(ironmanArmor);

    // VÒNG TRÒN HUD NĂNG LƯỢNG SANG TRỌNG
    const ringGeo = new THREE.RingGeometry(2.2, 2.25, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
    const hudRing = new THREE.Mesh(ringGeo, ringMat);
    ironmanArmor.add(hudRing);

    // 3. BIẾN ĐIỀU KHIỂN & TRẠNG THÁI
    let targetX = baseOffsetX, targetY = -0.2;
    let handPinchScale = 1.0;
    let isFist = false;
    let explodeProgress = 0;
    let lastHandX = null;
    let isPanelOpen = false;

    // 4. MEDIAPIPE HAND TRACKING
    function onResults(results) {
      loadingElement.style.display = 'none';
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        
        // Di chuyển bộ giáp quanh vùng góc trái
        targetX = baseOffsetX + (0.5 - lm[9].x) * 4.0;
        targetY = (0.5 - lm[9].y) * 4.0;

        // Phóng to / Thu nhỏ giáp
        const dx = lm[4].x - lm[8].x;
        const dy = lm[4].y - lm[8].y;
        const distPinch = Math.sqrt(dx * dx + dy * dy);
        handPinchScale = Math.max(0.4, Math.min(distPinch * 5, 2.3));

        // Kiểm tra Xòe 5 ngón tay
        const tips = [4, 8, 12, 16, 20];
        let openFingers = 0;
        for (let i = 0; i < tips.length; i++) {
          const tx = lm[tips[i]].x - lm[0].x;
          const ty = lm[tips[i]].y - lm[0].y;
          if (Math.sqrt(tx * tx + ty * ty) > 0.33) openFingers++;
        }
        const isOpenHand = (openFingers === 5);
        isFist = (openFingers <= 1);

        // Vuốt xòe tay từ Trái sang Phải để mở Panel
        const currentHandX = lm[9].x;
        if (isOpenHand) {
          if (lastHandX !== null) {
            const deltaX = currentHandX - lastHandX;
            if (deltaX < -0.04) {
              isPanelOpen = true;
              controlPanel.classList.add('active');
            } else if (deltaX > 0.04) {
              isPanelOpen = false;
              controlPanel.classList.remove('active');
            }
          }
          lastHandX = currentHandX;
        } else {
          lastHandX = null;
        }

        if (isFist) {
          hudMode.innerText = "MODE: ARMOR DISASSEMBLY";
          hudMode.style.color = "#ff3300";
        } else if (isPanelOpen) {
          hudMode.innerText = "MODE: CONTROL PANEL ACTIVE";
          hudMode.style.color = "#00ffcc";
        } else {
          hudMode.innerText = "MODE: HOLOGRAM TRACKING ACTIVE";
          hudMode.style.color = "#00f0ff";
        }

      } else {
        handPinchScale = 1.0;
        isFist = false;
        lastHandX = null;
        hudMode.innerText = "SEARCHING FOR HAND SIGNALS...";
        hudMode.style.color = "#ffaa00";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });
    cameraUtils.start();

    // 5. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);

      ironmanArmor.position.x += (targetX - ironmanArmor.position.x) * 0.2;
      ironmanArmor.position.y += (targetY - ironmanArmor.position.y) * 0.2;

      // Xoay bộ giáp quay vòng sang bên trái
      ironmanArmor.rotation.y -= 0.012; 
      hudRing.rotation.z += 0.01;

      // Nổ giáp
      if (isFist) {
        if (explodeProgress < 1.0) explodeProgress += 0.12;
      } else {
        if (explodeProgress > 0.0) explodeProgress -= 0.08;
      }

      const pos = geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const bx = originalPositions[i * 3] * handPinchScale;
        const by = originalPositions[i * 3 + 1] * handPinchScale;
        const bz = originalPositions[i * 3 + 2] * handPinchScale;

        const ex = dirs[i * 3] * explodeProgress * 3.5;
        const ey = dirs[i * 3 + 1] * explodeProgress * 3.5;
        const ez = dirs[i * 3 + 2] * explodeProgress * 3.5;

        pos[i * 3] = bx + ex;
        pos[i * 3 + 1] = by + ey;
        pos[i * 3 + 2] = bz + ez;
      }
      geometry.attributes.position.needsUpdate = true;

      if (explodeProgress > 0.2) {
        material.color.setHex(0xff2200);
      } else {
        material.color.setHex(0x00f0ff);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
