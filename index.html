<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAYA / JARVIS AI INTERFACE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #020813;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #00f0ff;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    video {
      transform: scaleX(-1);
      position: absolute;
      top: 20px;
      right: 20px;
      width: 130px;
      height: 90px;
      border-radius: 8px;
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      z-index: 10;
      object-fit: cover;
    }

    /* TIÊU ĐỀ MAYA AI CHÍNH GIỮA TRÊN CÙNG */
    .top-header {
      position: absolute;
      top: 25px;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .main-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #00f0ff;
      text-shadow: 0 0 12px #00f0ff;
    }
    .sub-title {
      font-size: 11px;
      color: #00ffcc;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* VÒNG TRÒN LÕI ARC REACTOR CHÍNH GIỮA (GIAO DIỆN MẶC ĐỊNH) */
    .center-reactor {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 3px solid #00f0ff;
      box-shadow: 0 0 30px #00f0ff, inset 0 0 25px #00f0ff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
      transition: all 0.8s ease;
    }
    .center-reactor-inner {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px dashed #00ffcc;
      animation: spin 12s linear infinite;
    }
    .center-reactor-core {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 10%, #00f0ff 60%, rgba(0,240,255,0.1) 100%);
      box-shadow: 0 0 25px #00f0ff;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Khi kích hoạt bằng tiếng "Chào" hoặc tay, Lõi tâm thu nhỏ và giáp hiện ra */
    body.active-mode .center-reactor {
      opacity: 0.3;
      transform: translate(-50%, -50%) scale(0.7);
    }

    /* BẢNG WIDGET TRÁI & PHẢI TRÊN MÀN HÌNH BAN ĐẦU */
    .widget-left {
      position: absolute;
      top: 120px;
      left: 30px;
      width: 220px;
      z-index: 10;
      pointer-events: none;
    }
    .widget-box {
      background: rgba(2, 12, 27, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-left: 3px solid #00f0ff;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      backdrop-filter: blur(4px);
    }
    .widget-title {
      font-size: 11px;
      font-weight: bold;
      color: #00f0ff;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .widget-val {
      font-size: 18px;
      font-weight: bold;
      color: #00ffcc;
    }

    /* BẢNG ĐIỀU KHIỂN TRƯỢT SANG TỪ BÊN PHẢI */
    #control-panel {
      position: absolute;
      bottom: 40px;
      right: -380px;
      width: 320px;
      padding: 20px;
      background: rgba(2, 12, 27, 0.92);
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
      border-radius: 10px;
      z-index: 30;
      transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(8px);
    }
    #control-panel.active {
      right: 30px;
    }
    .panel-header {
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #00f0ff;
      padding-bottom: 6px;
      margin-bottom: 10px;
      color: #00f0ff;
      display: flex;
      justify-content: space-between;
    }
    .panel-item {
      font-size: 12px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      font-size: 15px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00f0ff;
      z-index: 20;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">CONNECTING TO MAYA AI INTERFACE...</div>
  
  <div class="top-header">
    <div class="main-title">MAYA AI</div>
    <div id="voice-hud" class="sub-title">SAY "CHÀO" TO ACTIVATE ARMOR</div>
  </div>

  <!-- VÒNG TRÒN ARC REACTOR CHÍNH GIỮA BAN ĐẦU -->
  <div class="center-reactor">
    <div class="center-reactor-inner"></div>
    <div class="center-reactor-core"></div>
  </div>

  <!-- THÔNG SỐ WIDGET BÊN TRÁI -->
  <div class="widget-left">
    <div class="widget-box">
      <div class="widget-title">SYSTEM STATUS</div>
      <div class="widget-val">ONLINE</div>
    </div>
    <div class="widget-box">
      <div class="widget-title">VOICE SENSOR</div>
      <div id="voice-state" class="widget-val" style="font-size:13px; color:#ffaa00;">LISTENING...</div>
    </div>
  </div>

  <!-- BẢNG ĐIỀU KHIỂN BÊN PHẢI -->
  <div id="control-panel">
    <div class="panel-header">
      <span>MAYA SYSTEM CONTROL</span>
      <span style="color:#00ffcc;">ACTIVE</span>
    </div>
    <div class="panel-item"><span>ARMOR STATE:</span><span style="color:#00ffcc;">MARK 85 DEPLOYED</span></div>
    <div class="panel-item"><span>ROTATION:</span><span style="color:#00ffcc;">LEFT CONTINUOUS</span></div>
    <div class="panel-item"><span>VOICE COMMAND:</span><span style="color:#00f0ff;">"CHÀO" DETECTED</span></div>
    <div class="panel-item"><span>GESTURE PANEL:</span><span style="color:#00f0ff;">SWIPE OPENED</span></div>
  </div>

  <video id="input-video" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    const videoElement = document.getElementById('input-video');
    const loadingElement = document.getElementById('loading');
    const voiceHud = document.getElementById('voice-hud');
    const voiceState = document.getElementById('voice-state');
    const controlPanel = document.getElementById('control-panel');
    
    // 1. SCENE THREE.JS
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6.0;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. TẠO MÔ HÌNH BỘ GIÁP 3D HOLOGRAM (BAN ĐẦU ẨN, CHỈ HIỆN KHI KÍCH HOẠT)
    const armorGroup = new THREE.Group();
    armorGroup.visible = false; // Ban dau an theo giao dien video

    const wireMaterial = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      wireframe: true,
      transparent: true,
      opacity: 0.7
    });

    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.95
    });

    // Mũ bảo hiểm
    const helmetGeo = new THREE.ConeGeometry(0.55, 0.9, 8, 4);
    helmetGeo.rotateX(Math.PI);
    const helmet = new THREE.Mesh(helmetGeo, wireMaterial);
    helmet.position.y = 1.55;
    helmet.scale.set(1, 1.1, 0.85);
    armorGroup.add(helmet);

    // Visor mắt sáng
    const visorGeo = new THREE.BoxGeometry(0.5, 0.1, 0.3);
    const visor = new THREE.Mesh(visorGeo, glowMaterial);
    visor.position.set(0, 1.52, 0.32);
    armorGroup.add(visor);

    // Vai & Thân ngực
    const leftShoulder = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 1), wireMaterial);
    leftShoulder.position.set(-1.1, 0.8, 0);
    armorGroup.add(leftShoulder);

    const rightShoulder = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 1), wireMaterial);
    rightShoulder.position.set(1.1, 0.8, 0);
    armorGroup.add(rightShoulder);

    const chestGeo = new THREE.CylinderGeometry(0.95, 0.6, 1.2, 7, 2);
    const chest = new THREE.Mesh(chestGeo, wireMaterial);
    chest.position.y = 0.6;
    armorGroup.add(chest);

    const arcGeo = new THREE.RingGeometry(0.12, 0.28, 16);
    const arcReactor = new THREE.Mesh(arcGeo, glowMaterial);
    arcReactor.position.set(0, 0.7, 0.58);
    armorGroup.add(arcReactor);

    const waistGeo = new THREE.CylinderGeometry(0.58, 0.45, 1.0, 6, 2);
    const waist = new THREE.Mesh(waistGeo, wireMaterial);
    waist.position.y = -0.4;
    armorGroup.add(waist);

    // Đặt bộ giáp ở góc trái màn hình
    const baseOffsetX = -2.6;
    armorGroup.position.x = baseOffsetX;
    armorGroup.position.y = -0.2;
    scene.add(armorGroup);

    // 3. ĐIỀU KHIỂN BẰNG GIỌNG NÓI "CHÀO"
    let isActivated = false;
    let isPanelOpen = false;

    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (window.SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'vi-VN';

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim().toLowerCase();
        voiceState.innerText = `HEARD: "${transcript}"`;

        if (transcript.includes('chào') || transcript.includes('hello') || transcript.includes('maya')) {
          activateArmorSystem();
        }
      };

      recognition.onerror = () => {
        voiceState.innerText = "MIC READY";
      };

      recognition.start();
    } else {
      voiceState.innerText = "NO VOICE SUPP";
    }

    function activateArmorSystem() {
      isActivated = true;
      armorGroup.visible = true; // Hiện giáp ở góc trái
      isPanelOpen = true;
      controlPanel.classList.add('active'); // Trượt bảng điều khiển bên phải ra
      document.body.classList.add('active-mode');
      voiceHud.innerText = "SYSTEM ACTIVATED - MAYA ONLINE";
      speakJARVIS("Welcome back, Sir. Armor deployed.");
    }

    function speakJARVIS(text) {
      if ('speechSynthesis' in window) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'en-US';
        window.speechSynthesis.speak(speech);
      }
    }

    // 4. MEDIAPIPE HAND TRACKING & VUỐT XÒE TAY
    let targetX = baseOffsetX, targetY = -0.2;
    let handPinchScale = 1.0;
    let lastHandX = null;

    function onResults(results) {
      loadingElement.style.display = 'none';
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        
        targetX = baseOffsetX + (0.5 - lm[9].x) * 3.5;
        targetY = (0.5 - lm[9].y) * 3.5;

        // Chụm 2 ngón tay thu phóng giáp
        const dx = lm[4].x - lm[8].x;
        const dy = lm[4].y - lm[8].y;
        const distPinch = Math.sqrt(dx * dx + dy * dy);
        handPinchScale = Math.max(0.5, Math.min(distPinch * 4.5, 2.2));

        // Kiểm tra xòe 5 ngón tay
        const tips = [4, 8, 12, 16, 20];
        let openFingers = 0;
        for (let i = 0; i < tips.length; i++) {
          const tx = lm[tips[i]].x - lm[0].x;
          const ty = lm[tips[i]].y - lm[0].y;
          if (Math.sqrt(tx * tx + ty * ty) > 0.33) openFingers++;
        }
        const isOpenHand = (openFingers === 5);

        // Vuốt xòe tay Trái -> Phải để bật/tắt Bảng điều khiển
        const currentHandX = lm[9].x;
        if (isOpenHand) {
          if (!isActivated) activateArmorSystem(); // Xòe tay cũng giúp kích hoạt hệ thống

          if (lastHandX !== null) {
            const deltaX = currentHandX - lastHandX;
            if (deltaX < -0.04) {
              isPanelOpen = true;
              controlPanel.classList.add('active');
            } else if (deltaX > 0.04) {
              isPanelOpen = false;
              controlPanel.classList.remove('active');
            }
          }
          lastHandX = currentHandX;
        } else {
          lastHandX = null;
        }

      } else {
        handPinchScale = 1.0;
        lastHandX = null;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });
    cameraUtils.start();

    // 5. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);

      if (armorGroup.visible) {
        armorGroup.position.x += (targetX - armorGroup.position.x) * 0.18;
        armorGroup.position.y += (targetY - armorGroup.position.y) * 0.18;
        armorGroup.scale.set(handPinchScale, handPinchScale, handPinchScale);

        // Xoay bộ giáp vòng tròn sang bên trái liên tục
        armorGroup.rotation.y -= 0.012; 
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
