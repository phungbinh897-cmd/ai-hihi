<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Iron Man Mark-85 Armor System</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #020813;
      font-family: 'Courier New', Courier, monospace;
      color: #00f0ff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    video {
      transform: scaleX(-1);
      position: absolute;
      top: 15px;
      right: 15px;
      width: 130px;
      height: 95px;
      border-radius: 8px;
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      z-index: 10;
    }
    .hud-overlay {
      position: absolute;
      top: 15px;
      left: 20px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px #00f0ff;
    }
    .hud-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .hud-status {
      font-size: 12px;
      color: #00ffcc;
      margin-top: 5px;
    }

    /* BẢNG ĐIỀU KHIỂN JARVIS */
    #control-panel {
      position: absolute;
      bottom: 30px;
      right: -350px;
      width: 280px;
      padding: 18px;
      background: rgba(2, 12, 27, 0.9);
      border: 1.5px solid #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      z-index: 30;
      transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(6px);
    }
    #control-panel.active {
      right: 20px;
    }
    .panel-header {
      font-size: 14px;
      font-weight: bold;
      border-bottom: 1px solid #00f0ff;
      padding-bottom: 5px;
      margin-bottom: 8px;
      color: #00f0ff;
    }
    .panel-item {
      font-size: 11px;
      margin: 6px 0;
      display: flex;
      justify-content: space-between;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      font-size: 16px;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00f0ff;
      z-index: 20;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="loading">INITIALIZING MARK-85 HOLOGRAM...</div>
  
  <div class="hud-overlay">
    <div class="hud-title">MARK-85 ARMOR HUD</div>
    <div id="hud-mode" class="hud-status">WAITING FOR HAND SIGNALS</div>
  </div>

  <div id="control-panel">
    <div class="panel-header">JARVIS CONTROL PANEL</div>
    <div class="panel-item"><span>ARMOR MODEL:</span><span style="color:#00ffcc;">MARK 85 (HD)</span></div>
    <div class="panel-item"><span>ARC REACTOR:</span><span style="color:#00ffcc;">ONLINE (100%)</span></div>
    <div class="panel-item"><span>INTEGRITY:</span><span style="color:#00ffcc;">100% STABLE</span></div>
    <div class="panel-item"><span>GESTURE:</span><span style="color:#00f0ff;">SWIPE TOGGLE</span></div>
  </div>

  <video id="input-video" autoplay playsinline></video>
  <div id="canvas-container"></div>

  <script>
    const videoElement = document.getElementById('input-video');
    const loadingElement = document.getElementById('loading');
    const hudMode = document.getElementById('hud-mode');
    const controlPanel = document.getElementById('control-panel');
    
    // 1. THREE.JS SCENE SETUP
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6.0;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 2. DỰNG MÔ HÌNH BỘ GIÁP NÉT ĐẸP (GEOMETRIC HOLOGRAM MESH)
    const armorGroup = new THREE.Group();

    // Vật liệu Hologram sắc nét
    const wireMaterial = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      wireframe: true,
      transparent: true,
      opacity: 0.6
    });

    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.85
    });

    // A. MŨ BẢO HIỂM IRON MAN (HELMET)
    const helmetGeo = new THREE.ConeGeometry(0.55, 0.9, 8, 4);
    helmetGeo.rotateX(Math.PI);
    const helmet = new THREE.Mesh(helmetGeo, wireMaterial);
    helmet.position.y = 1.55;
    helmet.scale.set(1, 1.1, 0.85);
    armorGroup.add(helmet);

    // KÍNH MẮT RỰC SÁNG (VISOR)
    const visorGeo = new THREE.BoxGeometry(0.5, 0.1, 0.3);
    const visor = new THREE.Mesh(visorGeo, glowMaterial);
    visor.position.set(0, 1.52, 0.32);
    armorGroup.add(visor);

    // B. VAI GIÁP (SHOULDER PADS)
    const leftShoulder = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 1), wireMaterial);
    leftShoulder.position.set(-1.1, 0.8, 0);
    armorGroup.add(leftShoulder);

    const rightShoulder = new THREE.Mesh(new THREE.OctahedronGeometry(0.45, 1), wireMaterial);
    rightShoulder.position.set(1.1, 0.8, 0);
    armorGroup.add(rightShoulder);

    // C. NGỰC GIÁP (CHEST PLATE)
    const chestGeo = new THREE.CylinderGeometry(0.95, 0.6, 1.2, 7, 2);
    const chest = new THREE.Mesh(chestGeo, wireMaterial);
    chest.position.y = 0.6;
    armorGroup.add(chest);

    // D. LÕI ARC REACTOR RỰC SÁNG Ở NGỰC (ARC REACTOR)
    const arcGeo = new THREE.RingGeometry(0.12, 0.28, 16);
    const arcReactor = new THREE.Mesh(arcGeo, glowMaterial);
    arcReactor.position.set(0, 0.7, 0.58);
    armorGroup.add(arcReactor);

    // E. THÂN BỤNG & HÔNG (WAIST)
    const waistGeo = new THREE.CylinderGeometry(0.58, 0.45, 1.0, 6, 2);
    const waist = new THREE.Mesh(waistGeo, wireMaterial);
    waist.position.y = -0.4;
    armorGroup.add(waist);

    // CỐ ĐỊNH VỊ TRÍ GÓC TRÁI MÀN HÌNH
    const baseOffsetX = -2.6;
    armorGroup.position.x = baseOffsetX;
    armorGroup.position.y = -0.2;
    scene.add(armorGroup);

    // VÒNG TRÒN DỰNG NĂNG LƯỢNG HUD
    const ringGeo = new THREE.RingGeometry(2.1, 2.15, 36);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
    const hudRing = new THREE.Mesh(ringGeo, ringMat);
    armorGroup.add(hudRing);

    // 3. BIẾN THEO DÕI
    let targetX = baseOffsetX, targetY = -0.2;
    let handPinchScale = 1.0;
    let lastHandX = null;
    let isPanelOpen = false;

    // 4. MEDIAPIPE HAND TRACKING
    function onResults(results) {
      loadingElement.style.display = 'none';
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lm = results.multiHandLandmarks[0];
        
        // Di chuyển bộ giáp quanh vùng góc trái
        targetX = baseOffsetX + (0.5 - lm[9].x) * 3.5;
        targetY = (0.5 - lm[9].y) * 3.5;

        // Phóng to / Thu nhỏ giáp bằng chụm 2 ngón tay
        const dx = lm[4].x - lm[8].x;
        const dy = lm[4].y - lm[8].y;
        const distPinch = Math.sqrt(dx * dx + dy * dy);
        handPinchScale = Math.max(0.5, Math.min(distPinch * 4.5, 2.2));

        // Kiểm tra Xòe 5 ngón tay
        const tips = [4, 8, 12, 16, 20];
        let openFingers = 0;
        for (let i = 0; i < tips.length; i++) {
          const tx = lm[tips[i]].x - lm[0].x;
          const ty = lm[tips[i]].y - lm[0].y;
          if (Math.sqrt(tx * tx + ty * ty) > 0.33) openFingers++;
        }
        const isOpenHand = (openFingers === 5);

        // Vuốt xòe tay Trái -> Phải để mở Panel
        const currentHandX = lm[9].x;
        if (isOpenHand) {
          if (lastHandX !== null) {
            const deltaX = currentHandX - lastHandX;
            if (deltaX < -0.04) {
              isPanelOpen = true;
              controlPanel.classList.add('active');
            } else if (deltaX > 0.04) {
              isPanelOpen = false;
              controlPanel.classList.remove('active');
            }
          }
          lastHandX = currentHandX;
        } else {
          lastHandX = null;
        }

        if (isPanelOpen) {
          hudMode.innerText = "MODE: CONTROL PANEL ACTIVE";
          hudMode.style.color = "#00ffcc";
        } else {
          hudMode.innerText = "MODE: HOLOGRAM TRACKING ACTIVE";
          hudMode.style.color = "#00f0ff";
        }

      } else {
        handPinchScale = 1.0;
        lastHandX = null;
        hudMode.innerText = "SEARCHING FOR HAND SIGNALS...";
        hudMode.style.color = "#ffaa00";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 0,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });
    cameraUtils.start();

    // 5. ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);

      // Bám theo vị trí tay mượt mà
      armorGroup.position.x += (targetX - armorGroup.position.x) * 0.18;
      armorGroup.position.y += (targetY - armorGroup.position.y) * 0.18;

      // Áp dụng tỉ lệ phóng to / thu nhỏ
      armorGroup.scale.set(handPinchScale, handPinchScale, handPinchScale);

      // BỘ GIÁP XOAY TRÒN SANG BÊN TRÁI LIÊN TỤC
      armorGroup.rotation.y -= 0.012; 
      hudRing.rotation.z += 0.01;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
